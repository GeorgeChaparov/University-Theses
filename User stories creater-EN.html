<html>
    <body>
    </body>
    <style>

body {
    background: white;
    font-family: "Segoe UI", sans-serif;
    
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;

    height: fit-content;
}

.story-card {
    width: 280px;
    height: 360px;

    background: white;

    border: 4px solid #222;
    border-radius: 24px;

    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 32px;
    box-sizing: border-box;

    margin-left: 20px;
    margin-top: 20px;
}

.content {
    text-align: center;
    font-size: 1.1rem;
    line-height: 1.6;
    color: #ffffff;
}

.priority {
    position: absolute;

    top: 16px;
    right: 16px;

    font-weight: 800;
    font-size: 1rem;

    padding: 8px 12px;

    border-radius: 999px;

    letter-spacing: 1px;

    background-color: black;
}

/* MoSCoW priorities */

.priority-must {
    background: #d32f2f;
    color: white;
}

.priority-should {
    background: #f57c00;
    color: white;
}

.priority-could {
    background: #1976d2;
    color: white;
}

.priority-wont {
    background: #616161;
    color: white;
}
    </style>
    <script>
        const requirements = [
            ["As a user, I want to be able see where the participant in the experiment is looking at so I can judge when an event begins and ends.", "MUST"],
            ["As a user, I want to be able to make adjustments, horizontally and vertically, to the participant's gaze to correct any possible sensor interference.", "MUST"],
            ["As a user, I want to be able to load the data from a given experiment so I can classify it.", "MUST"],
            ["As a user, I want to be able to create, delete, and edit so I can categorize the data.", "MUST"],
            ["As a user, I want to be able to change what an existing event is classified as to correct any mistakes.", "MUST"],
            ["As a user, I want to be able to jump to any point in the recording to make my work easier.", "should"],
            ["As a user, I want to be able to split an already created event so I can edit mistakes made by the artificial intelligence.", "should"],
            ["As a user, I want to see what type the last event created was to reduce the chance of making a mistake.", "should"],
            ["As a user, I want to be able to go back and forth on the changes I've made because it will make my job easier.", "could"],
            ["As a user, I want to have keyboard shortcuts for as many functions as possible to speed up the work process.", "could"],
            ["As a user, I want to see every event created so far so I can track my progress.", "could"],
            ["As a user, I want to be able to edit the length of the clip so I can cut out unnecessary parts at the beginning and end.", "wont"],
    ];

    const body = document.getElementsByTagName("body")[0];

    requirements.forEach(requirement => {
        let cardClassName = ""
        const requirementPriority = requirement[1].toUpperCase();
        if (requirementPriority === "MUST") {
            cardClassName = "story-card priority-must";
        }
        else if (requirementPriority === "SHOULD") {
            cardClassName = "story-card priority-should";
        }
        else if (requirementPriority === "COULD") {
            cardClassName = "story-card priority-could";
        }
        else if (requirementPriority === "WONT") {
            cardClassName = "story-card priority-wont";
        }

        const card = document.createElement("div");
        card.className = cardClassName;

        const priority = document.createElement("div");
        priority.className = "priority"
        priority.innerText = requirementPriority;

        const content = document.createElement("div");
        content.className = "content"

        const paragraph = document.createElement("p");
        paragraph.innerText = requirement[0]

        content.appendChild(paragraph);

        card.appendChild(priority);
        card.appendChild(content);

        body.appendChild(card);

        /*
        <div class="story-card priority-should">
            <div class="priority">SHOULD</div>

            <div class="content">
                <p>
                    Като потребител, искам да зареждам записа от на експеримента, за да мога да класифицирам данните.
                </p>
            </div>
            
        </div>
        */
    });

    </script>
</html>
